<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 p-3" style="background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); font-family: 'Helvetica Neue', Arial, sans-serif; color: #e5e5e5;">

  <form class="card overflow-hidden" style="background-color: #0d0d0d; border: 1px solid #d4d4d8; box-shadow: 0 0 20px rgba(192, 192, 192, 0.25); width: 100%; max-width: 380px; border-radius: 4px;">
    <div class="text-center py-2 fw-bold text-uppercase" style="background: linear-gradient(135deg, #e6e6e6 0%, #ffffff 40%, #8a8a8a 60%, #b0b0b0 100%); color: #000000; letter-spacing: 1.5px; font-size: 13px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);">
      Registro de usuario
    </div>

    <div class="card-body p-4">
      <div class="mb-3">
        <label for="nombre" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">NOMBRE COMPLETO</label>
        <input type="text" id="nombre" name="nombre" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px;">
      </div>

      <div class="mb-3">
        <label for="correo" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">CORREO</label>
        <input type="email" id="correo" name="correo" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px;">
      </div>

      <div class="mb-3">
        <label for="confirmar-correo" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">CORREO</label>
        <input type="email" id="confirmar-correo" name="confirmar-correo" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px;">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">CONTRASEÑA</label>
        <input type="password" id="password" name="password" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px;">
      </div>

      <div class="mb-3">
        <label for="confirmar-password" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">CONFIRMAR CONTRASEÑA</label>
        <input type="password" id="confirmar-password" name="confirmar-password" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px;">
      </div>

      <div class="mb-3">
        <label for="telefono" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">TELÉFONO (opcional)</label>
        <input type="tel" id="telefono" name="telefono" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px;">
      </div>

      <div class="row g-2 mb-4">
        <div class="col-6">
          <select name="region" id="region" class="form-select" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 11px; border-radius: 2px;">
            <option value="">-- Región --</option>
            <option value="metropolitana">Metropolitana</option>
            <option value="araucania">Araucanía</option>
            <option value="nuble">Ñuble</option>
          </select>
        </div>
        <div class="col-6">
          <select name="comuna" id="comuna" class="form-select" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 11px; border-radius: 2px;">
            <option value="">-- Comuna --</option>
            <option value="linares">Linares</option>
            <option value="longavi">Longaví</option>
            <option value="concepcion">Concepción</option>
          </select>
        </div>
      </div>

      <div class="text-center">
        <button type="submit" class="btn px-4 py-2" style="background: linear-gradient(135deg, #f3f4f6 0%, #ffffff 40%, #9ca3af 60%, #d1d5db 100%); color: #0a0a0a; border: 1px solid #ffffff; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; border-radius: 2px; box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);">REGISTRAR</button>
      </div>
    </div>
  </form>

</body>
</html>
