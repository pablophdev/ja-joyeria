<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 p-3" style="background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); font-family: 'Helvetica Neue', Arial, sans-serif; color: #e5e5e5;">

  <div class="text-center mb-4">
    <div style="width: 100px; height: 100px; margin: 0 auto 15px auto; position: relative;">
        <img src="/img/Logo Jarod.jpg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid #d4d4d8; box-shadow: 0 0 15px rgba(212, 212, 216, 0.3);">
    </div>
    <h1 class="fs-4 fw-normal" style="color: #e5e5e5; letter-spacing: 1px;">JA</h1>
  </div>

  <form class="card overflow-hidden" style="background-color: #0d0d0d; border: 1px solid #d4d4d8; box-shadow: 0 0 20px rgba(192, 192, 192, 0.25); width: 100%; max-width: 480px; border-radius: 4px;">
    <div class="py-2 px-3 fw-bold" style="background: linear-gradient(135deg, #e6e6e6 0%, #ffffff 40%, #8a8a8a 60%, #b0b0b0 100%); color: #000000; font-size: 11px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);">
      inicio de sesión
    </div>

    <div class="card-body p-4 pt-4">
      <div class="mb-4">
        <label for="correo" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">CORREO</label>
        <input type="email" id="correo" name="correo" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px; padding: 10px;">
      </div>

      <div class="mb-5">
        <label for="password" class="form-label mb-1" style="font-size: 10px; font-weight: 600; color: #b8b8b8; letter-spacing: 1px;">CONTRASEÑA</label>
        <input type="password" id="password" name="password" class="form-control" style="background-color: #161616; border: 1px solid #52525b; color: #ffffff; font-size: 12px; border-radius: 2px; padding: 10px;">
      </div>

      <div class="text-center mb-3">
        <button type="submit" class="btn px-5 py-3" style="background: linear-gradient(135deg, #f3f4f6 0%, #ffffff 40%, #9ca3af 60%, #d1d5db 100%); color: #0a0a0a; border: 1px solid #ffffff; font-weight: 500; font-size: 12px; border-radius: 2px; box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15); min-width: 200px;">Iniciar sesión</button>
      </div>
    </div>
  </form>

</body>
</html>
