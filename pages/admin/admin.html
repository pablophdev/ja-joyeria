<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-light">

<div class="d-flex">

  <!-- Sidebar -->
  <div class="d-flex flex-column justify-content-between bg-white border-end vh-100" style="width: 220px;">
    <div>
      <div class="d-flex align-items-center gap-2 p-3 border-bottom">
        <span class="border rounded-circle" style="width: 24px; height: 24px;"></span>
        <span class="fw-semibold">Company</span>
      </div>
      <div class="list-group list-group-flush">
        <a href="#" class="list-group-item list-group-item-action list-group-item-primary">Dashboard</a>
        <a href="#" class="list-group-item list-group-item-action">Orders</a>
        <a href="#" class="list-group-item list-group-item-action">Inventory</a>
        <a href="#" class="list-group-item list-group-item-action">Reports</a>
        <a href="#" class="list-group-item list-group-item-action">Employees</a>
        <a href="#" class="list-group-item list-group-item-action">Customers</a>
      </div>
    </div>

    <div>
      <div class="list-group list-group-flush">
        <a href="#" class="list-group-item list-group-item-action">Settings</a>
        <a href="#" class="list-group-item list-group-item-action">Profile</a>
        <a href="#" class="list-group-item list-group-item-action">Search</a>
        <a href="#" class="list-group-item list-group-item-action">Help</a>
      </div>
      <div class="d-flex align-items-center gap-2 p-3 border-top">
        <span class="rounded-circle bg-secondary" style="width: 28px; height: 28px;"></span>
        <span>Profile</span>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex-fill">
    <div class="d-flex justify-content-between align-items-center bg-body-secondary border-bottom p-3">
      <h4 class="mb-0">¡HOLA Administrador!</h4>
      <span>🔔</span>
    </div>

    <div class="bg-body-secondary border-bottom" style="min-height: 350px;"></div>
    <div class="bg-white" style="min-height: 350px;"></div>
  </div>

</div>

</html>
