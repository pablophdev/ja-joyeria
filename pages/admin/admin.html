<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
  <div id="sidebar-container" class="h-100 flex-shrink-0"></div>


  <!-- Main content -->
  <div class="flex-fill">
    <div class="d-flex justify-content-between align-items-center bg-body-secondary border-bottom p-3">
      <h4 class="mb-0">¡HOLA Administrador!</h4>
      <span>🔔</span>
    </div>

    <div class="bg-body-secondary border-bottom" style="min-height: 350px;"></div>
    <div class="bg-white" style="min-height: 350px;"></div>
  </div>

</div>

<script>
  fetch('/components/sidebar-admin.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
    })
    .catch(error => console.error('Error al cargar el sidebar:', error));
</script>
<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
